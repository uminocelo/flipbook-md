<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Flipbook MD · Announcer</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body class="announcer">
  <header class="topbar">
    <a class="brand" href="/" target="_blank" rel="noopener noreferrer" aria-label="Flipbook MD home">FLIPBOOK <span>MD</span></a>
    <div class="topbar-right"><span id="deck-title">Loading presentation…</span><a class="view-link" href="/" target="_blank" rel="noopener noreferrer">Deck</a><button id="fullscreen" class="icon-button" title="Toggle fullscreen (F)" aria-label="Toggle fullscreen">⛶</button></div>
  </header>
  <main>
    <section id="slide" class="slide" aria-live="polite" aria-label="Current slide">
      <p class="loading">Loading your slides…</p>
    </section>
    <aside class="notes-panel" aria-label="Speaker notes">
      <h2>Notes</h2>
      <div id="notes" class="notes-body" aria-live="polite"><p class="notes-empty">No notes for this slide.</p></div>
    </aside>
    <nav class="controls" aria-label="Slide navigation">
      <button id="previous" class="nav-button" type="button" aria-label="Previous slide">← <span>Previous</span></button>
      <button id="play" class="nav-button primary" type="button" aria-pressed="false" aria-label="Play">▶ <span>Play</span></button>
      <div class="slide-meta"><span id="counter">— / —</span><div class="progress"><div id="progress-bar"></div></div></div>
      <button id="next" class="nav-button" type="button" aria-label="Next slide"><span>Next</span> →</button>
    </nav>
  </main>
  <footer><span>Made with <strong>Flipbook MD</strong></span><span>Speaker notes · ← / → or Space · P play</span></footer>
</body>
</html>

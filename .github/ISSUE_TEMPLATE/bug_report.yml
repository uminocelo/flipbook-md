name: Bug report
description: Something in Flipbook MD does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      placeholder: flipbook show ./my-talk
    validations:
      required: true
  - type: input
    id: input-path
    attributes:
      label: Input path
      description: The file or directory you passed to Flipbook.
      placeholder: examples/database-indexes-project
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: The output of `node --version`.
      placeholder: v22.21.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Presentation source
      description: Enough of the Markdown or presentation.yml to reproduce the problem. Remove anything private.
    validations:
      required: false
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the terminal output.
      render: shell
    validations:
      required: false
